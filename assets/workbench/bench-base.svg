<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrated workbench</title>
  <desc id="desc">A broad wooden worktable viewed slightly from above on a white background.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e9dc"/>
      <stop offset="1" stop-color="#dfcdb6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5d40"/>
      <stop offset="1" stop-color="#67412d"/>
    </linearGradient>
    <pattern id="grain" width="150" height="56" patternUnits="userSpaceOnUse">
      <path d="M-10 16C28 5 66 27 112 13s78 4 96 0M-20 43c48-13 92 12 142-2s73 5 98-3" fill="none" stroke="#855a3e" stroke-width="2" opacity=".16"/>
      <path d="M63 27c10-7 24-7 35 0-11 7-24 7-35 0z" fill="none" stroke="#855a3e" stroke-width="1.5" opacity=".12"/>
    </pattern>
    <clipPath id="topClip">
      <path d="M97 140H1103l79 430H18z"/>
    </clipPath>
    <filter id="tableShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#24150f" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#fff"/>
  <ellipse cx="600" cy="688" rx="525" ry="22" fill="#24150f" opacity=".09"/>

  <g filter="url(#tableShadow)" stroke="#29251f" stroke-linejoin="round">
    <path d="M97 140H1103l79 430H18z" fill="url(#top)" stroke-width="4"/>
    <path d="M18 570h1164l-44 64H62z" fill="url(#edge)" stroke-width="4"/>
    <path d="M76 633h92l-18 77H55zM1032 633h92l21 77h-95z" fill="#5a3827" stroke-width="4"/>
    <path d="M150 676h900" fill="none" stroke-width="13" stroke-linecap="round"/>
    <path d="M167 633l-14 60M1031 633l17 60" fill="none" stroke="#c7aa70" stroke-width="4" opacity=".55"/>
  </g>

  <g clip-path="url(#topClip)">
    <rect x="18" y="140" width="1164" height="430" fill="url(#grain)"/>
    <path d="M99 172h1002M73 319h1054M43 472h1112" fill="none" stroke="#9f7655" stroke-width="2" opacity=".22"/>
    <path d="M319 141L286 570M600 141v429M881 141l33 429" fill="none" stroke="#9f7655" stroke-width="2" opacity=".2"/>

    <g fill="#80543b" stroke="#29251f" stroke-width="2" opacity=".72">
      <circle cx="139" cy="253" r="8"/><circle cx="1061" cy="253" r="8"/>
      <circle cx="89" cy="515" r="10"/><circle cx="1110" cy="515" r="10"/>
    </g>
  </g>

  <path d="M98 140h1004l8 36H90z" fill="#c7aa70" stroke="#29251f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M125 155h950" fill="none" stroke="#fff" stroke-width="3" opacity=".48"/>

  <path d="M71 606c256 8 774 7 1058 0" fill="none" stroke="#d0ad72" stroke-width="3" opacity=".4"/>
</svg>
