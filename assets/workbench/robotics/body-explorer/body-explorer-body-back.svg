  <style>
    .body-surface { fill: #eee8dc; }
    .body-contour { fill: none; stroke: #2f2a24; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .surface-shade { fill: #d9cdbb; opacity: .34; }
    .surface-light { fill: #faf6ee; opacity: .48; }
    .anatomy-line { fill: none; stroke: #645c52; stroke-width: .72; stroke-linecap: round; stroke-linejoin: round; opacity: .55; vector-effect: non-scaling-stroke; }
    .anatomy-line--soft { opacity: .3; }
    .feature-line { fill: none; stroke: #342f29; stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .feature-fill { fill: #342f29; }
    .body-region { fill: #c5a66d; fill-opacity: 0; stroke: none; pointer-events: all; transition: fill-opacity 160ms ease; }
    .body-hotspot { cursor: pointer; outline: none; }
    .body-hotspot:hover .body-region, .body-hotspot:focus .body-region { fill-opacity: .18; }
    .body-hotspot.is-selected .body-region { fill: #a87d3e; fill-opacity: .27; }
    .body-hotspot:focus .focus-trace { opacity: .75; }
    .focus-trace { fill: none; stroke: #651f28; stroke-width: 1.05; stroke-dasharray: 2.2 3.4; opacity: 0; pointer-events: none; vector-effect: non-scaling-stroke; }
    @media (prefers-reduced-motion: reduce) { .body-region { transition: none; } }
  </style>
